name: Build VLC Android TV

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Android TV debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
        run: gradle --no-daemon --stacktrace :application:app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Android-TV-debug
          path: application/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
